services:
  api:
    build: ./api
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/html
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: jobfinder
      DB_USER: jobfinder
      DB_PASS: pass

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: jobfinder
      MYSQL_USER: jobfinder
      MYSQL_PASSWORD: pass
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: